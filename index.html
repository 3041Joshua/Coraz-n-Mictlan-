<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8" />
    <title>Corazon Mictlan</title>
    <meta name="description" content="Corazón Mictlan">
    <link rel="stylesheet" href="css corazon mictlan.css">
</head>
<body>

<main>
    <img src="INICIO CM/Logo principal.png" alt="" style="height: 100px; align-self: flex-start;" >

    <!-- Banner superior -->
    <div class="slider">
        <a href="Biografia Mictlan.html"><img src="INICIO CM/banner mictlan.jpg" alt="Imagen 1" class="active"></a>
        <a href="Biografia Juda.html"><img src="INICIO CM/banner juda .jpg" alt="Imagen 2"></a>
        <a href="Biografia ARTCAT.html"><img src="INICIO CM/banner zoe.jpg" alt="Imagen 3"></a>
        <button class="prev">&#10094;</button>
        <button class="next">&#10095;</button>
    </div>

    <!-- Catálogos -->
    <section style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px 20px; background-color: #f9f9f9;">
        <a href="Catalogo JUDA.html" class="caja-link">
            <img src="INICIO CM/C.O.J.png" alt="Catalogo Juda">
            <div>
                <h3>Catalogo de obras "El Méxicano"</h3>
                <p>Catálogo de obras del artista Juda Sánchez</p>
            </div>
        </a>
        <a href="Catalogo ZOE.html" class="caja-link">
            <img src="INICIO CM/C.O.Z.png" alt="Catalogo ARTCAT">
            <div>
                <h3>Catalogo de obras "ZOTE"</h3>
                <p>Catálogo de obras de la artista Zoe Escamilla</p>
            </div>
        </a>
    </section>

    <!-- Eventos Próximos -->
    <section class="eventos-fijos" id="eventos-dinamicos"></section>
</main>

<!-- Footer -->
<footer>
    <h3>Contacto</h3>
    <p>Corazón Mictlan</p>
    <p>Teléfono: +52 246 157 7066</p>
    <p>JSPrograment-Todos los derechos reservados</p>
</footer>

<!-- Scripts Slider -->
<script>
const slider = document.querySelector('.slider');
const images = slider.querySelectorAll('a img');
const prevBtn = slider.querySelector('.prev');
const nextBtn = slider.querySelector('.next');
let currentIndex = 0;

function showImage(index) {
    images.forEach((img, i) => {
        img.classList.toggle('active', i === index);
    });
}

prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage(currentIndex);
});

nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
});
</script>


<script>
async function cargarEventos(){
 try{
  const r=await fetch('/.netlify/functions/admin?action=public');
  const data=await r.json();
  const cont=document.getElementById('eventos-dinamicos');
  const eventos=(data.events||[]).filter(e=>e.active!==false);
  cont.innerHTML=eventos.length?eventos.map(e=>`<article class="evento-card"><img src="${e.image||'EVENTOS/Eventos Proximos .jpg'}" alt="${e.title||'Evento'}"><div><h3>${e.title||''}</h3><p>${e.description||''}</p>${e.date?`<p><strong>Fecha:</strong> ${e.date}</p>`:''}${e.time?`<p><strong>Hora:</strong> ${e.time}</p>`:''}${e.place?`<p><strong>Lugar:</strong> ${e.place}</p>`:''}${e.link?`<a href="${e.link}" target="_blank" rel="noopener">Más información</a>`:''}</div></article>`).join(''):`<img src="EVENTOS/Eventos Proximos .jpg" alt="Próximos eventos">`;
 }catch(e){}
}
cargarEventos();
</script>
</body>
</html>
