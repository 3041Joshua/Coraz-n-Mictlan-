<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Catalogo "ZOTE"</title><link rel="stylesheet" href="css catalogoZOTE.css"></head><body>
<header><div class="menu"><a href="index.html">Inicio</a><a href="Biografia ARTCAT.html">Sobre Mi</a></div></header>
<h1>ZOTE</h1>
<div class="catalogo" id="catalogo"></div>
<div id="miModal" class="modal"><div class="modal-content"><span class="close">&times;</span><div class="modal-img"><img id="modalImg" src="" alt=""></div><div class="modal-info"><h2 id="modalTitulo"></h2><p><strong>DESCRIPCION:</strong> <span id="modalMedidas"></span></p></div></div></div>
<script>
const FALLBACK=[];
const catalogo=document.getElementById('catalogo'),modal=document.getElementById('miModal'),modalImg=document.getElementById('modalImg'),modalTitulo=document.getElementById('modalTitulo'),modalMedidas=document.getElementById('modalMedidas');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(items){catalogo.innerHTML=items.map(o=>`<div class="obra" data-titulo="${esc(o.title)}" data-medidas="${esc(o.description)}" data-img="${esc(o.image)}"><img src="${esc(o.image)}" alt="${esc(o.title)}"><h2>${esc(o.title)}</h2><p>${esc(o.technique)}</p><p>${esc(o.measures)}</p><p>${esc(o.status)}</p><p>${esc(o.year)}</p><p>${esc(o.price)}</p></div>`).join('')||'<p style="text-align:center;grid-column:1/-1">No hay obras disponibles.</p>';catalogo.querySelectorAll('.obra').forEach(o=>o.addEventListener('click',()=>{modal.style.display='flex';modalImg.src=o.dataset.img;modalTitulo.textContent=o.dataset.titulo;modalMedidas.textContent=o.dataset.medidas}))}
fetch('/.netlify/functions/admin?action=public').then(r=>r.json()).then(d=>{if(d.ok&&d.catalogs&&Array.isArray(d.catalogs.zoe))render(d.catalogs.zoe);else render(FALLBACK)}).catch(()=>render(FALLBACK));
document.querySelector('.close').onclick=()=>modal.style.display='none';window.onclick=e=>{if(e.target===modal)modal.style.display='none'};
</script></body></html>
