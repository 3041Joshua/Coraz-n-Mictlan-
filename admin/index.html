<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Corazón Mictlan</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f1eb;color:#241f1b}.wrap{max-width:1100px;margin:auto;padding:30px}.panel{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 25px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:10px}.field textarea{min-height:90px}.item img{width:100%;height:180px;object-fit:cover;border-radius:12px;background:#eee}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#241f1b;color:white;margin:5px}.danger{background:#a33}.muted{color:#777}.hidden{display:none}#login{max-width:420px;margin:10vh auto}</style></head><body><div class="wrap">
<div id="login" class="panel"><h1>Corazón Mictlan</h1><p>Panel de administración</p><input id="password" type="password" placeholder="Contraseña" style="width:100%;box-sizing:border-box;padding:12px"><button class="btn" onclick="login()">Entrar</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><h1>Panel de administración</h1><button class="btn" onclick="logout()">Cerrar sesión</button><div class="panel"><h2>Eventos próximos</h2><p class="muted">Si no seleccionas una imagen al editar, se conserva la actual.</p><div id="events" class="grid"></div><button class="btn" onclick="newEvent()">+ Agregar evento</button></div><div class="panel"><h2>Cuadros de inicio</h2><div id="cards" class="grid"></div><button class="btn" onclick="newCard()">+ Agregar cuadro</button></div></div></div>
<script>
let data={events:[],cards:[]};
const api=(a)=>'/.netlify/functions/admin?action='+a;
async function login(){const password=document.querySelector('#password').value;const r=await fetch(api('login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});const x=await r.json();if(!x.ok)return loginMsg.textContent=x.error;load();}
async function logout(){await fetch(api('logout'),{method:'POST'});location.reload()}
async function load(){const r=await fetch(api('public'));if(!r.ok)return;data=await r.json();login.classList.add('hidden');app.classList.remove('hidden');render();}
function render(){events.innerHTML=data.events.map(e=>form(e,'event')).join('');cards.innerHTML=data.cards.map(c=>form(c,'card')).join('')}
function form(x,type){return `<div class="panel item"><img src="${x.image||'../EVENTOS/Eventos Proximos .jpg'}"><div class="field"><label>Título</label><input data-k="title" value="${esc(x.title||'')}"></div><div class="field"><label>Descripción</label><textarea data-k="description">${esc(x.description||'')}</textarea></div><div class="field"><label>Fecha</label><input data-k="date" value="${esc(x.date||'')}"></div><div class="field"><label>Hora</label><input data-k="time" value="${esc(x.time||'')}"></div><div class="field"><label>Lugar</label><input data-k="place" value="${esc(x.place||'')}"></div><div class="field"><label>Enlace</label><input data-k="link" value="${esc(x.link||'')}"></div><div class="field"><label>Nueva imagen (opcional)</label><input type="file" accept="image/*" data-image></div><button class="btn" onclick="save(this,'${type}','${x.id||''}')">Guardar</button>${x.id?`<button class="btn danger" onclick="del('${type}','${x.id}')">Eliminar</button>`:''}</div>`}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function newEvent(){data.events.push({id:crypto.randomUUID()});render()}function newCard(){data.cards.push({id:crypto.randomUUID()});render()}
async function save(btn,type,id){const box=btn.closest('.item');const obj={};box.querySelectorAll('[data-k]').forEach(i=>obj[i.dataset.k]=i.value);const f=box.querySelector('[data-image]').files[0];const fd=new FormData();fd.append('type',type);fd.append('id',id||crypto.randomUUID());fd.append('data',JSON.stringify(obj));if(f)fd.append('image',f);const r=await fetch(api('save'),{method:'POST',body:fd});const x=await r.json();if(!x.ok)return alert(x.error);data=x;render()}
async function del(type,id){if(!confirm('¿Eliminar este elemento?'))return;const r=await fetch(api('delete'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,id})});data=await r.json();render()}
load();
</script></body></html>
